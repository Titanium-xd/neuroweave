[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abb"
version = "0.1.0.dev1"
description = "Animal Brain Benchmark — biologically-derived connectome GNN benchmark (Phase 2)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "neuprint-python==0.6.3",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "numpy>=1.26",
    "networkx>=3.3",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "python-dotenv>=1.0",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pyflakes",
    "ruff",
]

[project.scripts]
abb-fetch = "scripts.data.fetch_sample:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["abb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
